name: Generate Snake
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Zeeshan-783
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=00ff88&color_dots=#0d0d0d,#1a3a2a,#1f6b3a,#28a745,#00ff88
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
